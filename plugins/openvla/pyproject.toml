[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovlab-openvla-plugin"
version = "0.2.0"
description = "OpenVLA policy, training, and checkpoint integration for OVLAB"
readme = "README.md"
authors = [{ name = "Jiří Konečný" }]
requires-python = ">=3.10"
dependencies = [
  "ovlab-core>=0.2.0",
  "ovlab-policy-sdk>=0.2.0",
  "ovlab-remote-policy>=0.2.0",
  "numpy>=1.24",
  "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."ovlab.plugin_projects"]
openvla = "ovlab_openvla_project:project_root"

