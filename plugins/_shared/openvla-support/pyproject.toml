[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovlab-openvla-support"
version = "0.2.0"
description = "Shared OpenVLA integration primitives and training implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ovlab-core>=0.2.0", "ovlab-policy-sdk>=0.2.0", "ovlab-remote-policy>=0.2.0", "numpy>=1.24", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]
