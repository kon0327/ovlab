# Composition example: copy to experiments/my-evaluation.yaml and select compatible benchmark inputs.
# OFT requires primary+wrist RGB and robot proprioception. QuIC requires a trained adapter.
# For the complete validated smoke composition see OVLAB examples/experiments/.
schema_version: "0.1.0"
kind: "experiment"
extends: "plugin://openvla-oft/evaluate/default.yaml"
experiment:
  id: "openvla-oft-local-eval"
  name: "Local openvla-oft evaluation"
  tags:
    - "example"
components:
  benchmark: "plugin://libero/benchmark/default.yaml"
  metrics: "ovlab://metrics/default.yaml"
  protocol: "ovlab://protocols/smoke.yaml"
  artifacts: "ovlab://artifacts/default.yaml"
