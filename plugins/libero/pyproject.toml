[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovlab-libero"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["ovlab-benchmarks>=0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ovlab_libero = ["task_catalog.json"]
