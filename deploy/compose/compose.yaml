name: ovlab

x-policy-security: &policy-security
  user: "10001:10001"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
  restart: "no"

x-policy-health: &policy-health
  test: [CMD, ovlab, service, health, --socket, /run/ovlab/policy.sock, --json]
  interval: 10s
  timeout: 8s
  retries: 6
  start_period: 15m

x-config-bundle: &config-bundle
  type: bind
  source: ${OVLAB_CONFIG_BUNDLE_PATH:?configuration bundle resolver did not set a host path}
  target: /opt/ovlab/configs
  read_only: true

services:
  policy-openvla:
    <<: *policy-security
    profiles: [openvla]
    image: ${OVLAB_OPENVLA_IMAGE:-ovlab-policy-openvla:local}
    command: [service, serve, "${OVLAB_EXPERIMENT_CONFIG:?configuration bundle resolver did not set an experiment path}", --socket, /run/ovlab/policy.sock]
    environment:
      OVLAB_DEPLOYMENT_PROFILE: ${OVLAB_DEPLOYMENT_PROFILE:-openvla}
      OVLAB_EXECUTION_PROFILE: ${OVLAB_EXECUTION_PROFILE:?configuration bundle resolver did not set an execution profile}
      OVLAB_CONFIG_BUNDLE_SHA256: ${OVLAB_CONFIG_BUNDLE_SHA256:?configuration bundle resolver did not set an identity}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/ovlab-huggingface
      HF_HUB_CACHE: /tmp/ovlab-huggingface/hub
      HF_MODULES_CACHE: /tmp/ovlab-transformers-modules
      OVLAB_RESOLVED_CHECKPOINT_ID: ${OVLAB_RESOLVED_CHECKPOINT_ID:?checkpoint resolver did not set an ID}
      OVLAB_RESOLVED_CHECKPOINT_CONTAINER_PATH: /checkpoints/resolved/${OVLAB_RESOLVED_CHECKPOINT_ID}
      OVLAB_CHECKPOINT_SOURCE_KIND: ${OVLAB_CHECKPOINT_SOURCE_KIND:?checkpoint resolver did not set provenance}
      OVLAB_CHECKPOINT_REPOSITORY: ${OVLAB_CHECKPOINT_REPOSITORY:?checkpoint resolver did not set repository}
      OVLAB_CHECKPOINT_REVISION: ${OVLAB_CHECKPOINT_REVISION:?checkpoint resolver did not set revision}
      OVLAB_CHECKPOINT_SHA256: ${OVLAB_CHECKPOINT_SHA256:?checkpoint resolver did not set SHA-256}
      OVLAB_IMAGE_DIGEST: ${OVLAB_OPENVLA_IMAGE_DIGEST:-unavailable}
      OVLAB_DEPLOYMENT_MANIFEST_SHA256: ${OVLAB_DEPLOYMENT_MANIFEST_SHA256:-unavailable}
      OVLAB_CONTAINER_RUNTIME_VERSION: ${OVLAB_CONTAINER_RUNTIME_VERSION:-unavailable}
      OVLAB_SERVICE_TOPOLOGY: benchmark-libero--af-unix--policy-openvla
      OVLAB_OFFLINE_MODE: hf-hub-offline,transformers-offline,network-none
      OVLAB_MOUNT_CONTRACT: config-bundle-ro,resolved-checkpoint-ro,rpc-rw
      NVIDIA_VISIBLE_DEVICES: ${OVLAB_GPU_DEVICE:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    volumes:
      - *config-bundle
      - rpc-openvla:/run/ovlab
      - type: bind
        source: ${OVLAB_RESOLVED_CHECKPOINT_PATH:?checkpoint resolver did not set a host path}
        target: /checkpoints/resolved/${OVLAB_RESOLVED_CHECKPOINT_ID}
        read_only: true
    healthcheck: *policy-health

  benchmark-openvla:
    <<: *policy-security
    profiles: [openvla]
    image: ${OVLAB_BENCHMARK_IMAGE:-ovlab-benchmark-libero:local}
    command: [run, "${OVLAB_EXPERIMENT_CONFIG:?configuration bundle resolver did not set an experiment path}", --output-root, /var/lib/ovlab/runs]
    environment:
      OVLAB_DEPLOYMENT_PROFILE: ${OVLAB_DEPLOYMENT_PROFILE:-openvla}
      OVLAB_EXECUTION_PROFILE: ${OVLAB_EXECUTION_PROFILE:?configuration bundle resolver did not set an execution profile}
      OVLAB_CONFIG_BUNDLE_SHA256: ${OVLAB_CONFIG_BUNDLE_SHA256:?configuration bundle resolver did not set an identity}
      MUJOCO_GL: egl
      MUJOCO_EGL_DEVICE_ID: ${OVLAB_EGL_DEVICE_ID:-0}
      OVLAB_IMAGE_DIGEST: ${OVLAB_BENCHMARK_IMAGE_DIGEST:-unavailable}
      OVLAB_DEPLOYMENT_MANIFEST_SHA256: ${OVLAB_DEPLOYMENT_MANIFEST_SHA256:-unavailable}
      OVLAB_CONTAINER_RUNTIME_VERSION: ${OVLAB_CONTAINER_RUNTIME_VERSION:-unavailable}
      OVLAB_SERVICE_TOPOLOGY: benchmark-libero--af-unix--policy-openvla
      OVLAB_OFFLINE_MODE: network-none
      OVLAB_MOUNT_CONTRACT: config-bundle-ro,datasets-ro,runs-rw,rpc-rw
      OVLAB_POSTPROCESSING_MODE: external
      OVLAB_RESOLVED_CHECKPOINT_ID: ${OVLAB_RESOLVED_CHECKPOINT_ID}
      OVLAB_RESOLVED_CHECKPOINT_CONTAINER_PATH: /checkpoints/resolved/${OVLAB_RESOLVED_CHECKPOINT_ID}
      OVLAB_CHECKPOINT_ID: ${OVLAB_RESOLVED_CHECKPOINT_ID}
      OVLAB_CHECKPOINT_SOURCE_KIND: ${OVLAB_CHECKPOINT_SOURCE_KIND}
      OVLAB_CHECKPOINT_HOST_PATH: ${OVLAB_RESOLVED_CHECKPOINT_PATH}
      OVLAB_CHECKPOINT_REPOSITORY: ${OVLAB_CHECKPOINT_REPOSITORY}
      OVLAB_CHECKPOINT_REVISION: ${OVLAB_CHECKPOINT_REVISION}
      OVLAB_CHECKPOINT_SHA256: ${OVLAB_CHECKPOINT_SHA256}
      NVIDIA_VISIBLE_DEVICES: ${OVLAB_GPU_DEVICE:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    gpus: all
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    depends_on:
      policy-openvla:
        condition: service_healthy
        restart: false
    volumes:
      - *config-bundle
      - rpc-openvla:/run/ovlab
      - type: bind
        source: ${OVLAB_DATASETS_PATH:?dataset resolver did not set a host path}
        target: /datasets
        read_only: true
      - type: bind
        source: ${OVLAB_RUNS_ROOT:-../../../ovlab-data/runs}
        target: /var/lib/ovlab/runs

  policy-openvla-oft:
    <<: *policy-security
    profiles: [oft]
    image: ${OVLAB_OFT_IMAGE:-ovlab-policy-openvla-oft:local}
    command: [service, serve, "${OVLAB_EXPERIMENT_CONFIG:?configuration bundle resolver did not set an experiment path}", --socket, /run/ovlab/policy.sock]
    environment:
      OVLAB_DEPLOYMENT_PROFILE: ${OVLAB_DEPLOYMENT_PROFILE:-oft}
      OVLAB_EXECUTION_PROFILE: ${OVLAB_EXECUTION_PROFILE:?configuration bundle resolver did not set an execution profile}
      OVLAB_CONFIG_BUNDLE_SHA256: ${OVLAB_CONFIG_BUNDLE_SHA256:?configuration bundle resolver did not set an identity}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /tmp/ovlab-huggingface
      HF_HUB_CACHE: /tmp/ovlab-huggingface/hub
      HF_MODULES_CACHE: /tmp/ovlab-transformers-modules
      OVLAB_RESOLVED_CHECKPOINT_ID: ${OVLAB_RESOLVED_CHECKPOINT_ID:?checkpoint resolver did not set an ID}
      OVLAB_RESOLVED_CHECKPOINT_CONTAINER_PATH: /checkpoints/resolved/${OVLAB_RESOLVED_CHECKPOINT_ID}
      OVLAB_CHECKPOINT_SOURCE_KIND: ${OVLAB_CHECKPOINT_SOURCE_KIND:?checkpoint resolver did not set provenance}
      OVLAB_CHECKPOINT_REPOSITORY: ${OVLAB_CHECKPOINT_REPOSITORY:?checkpoint resolver did not set repository}
      OVLAB_CHECKPOINT_REVISION: ${OVLAB_CHECKPOINT_REVISION:?checkpoint resolver did not set revision}
      OVLAB_CHECKPOINT_SHA256: ${OVLAB_CHECKPOINT_SHA256:?checkpoint resolver did not set SHA-256}
      TF_CPP_MIN_LOG_LEVEL: "3"
      OVLAB_IMAGE_DIGEST: ${OVLAB_OFT_IMAGE_DIGEST:-unavailable}
      OVLAB_DEPLOYMENT_MANIFEST_SHA256: ${OVLAB_DEPLOYMENT_MANIFEST_SHA256:-unavailable}
      OVLAB_CONTAINER_RUNTIME_VERSION: ${OVLAB_CONTAINER_RUNTIME_VERSION:-unavailable}
      OVLAB_SERVICE_TOPOLOGY: benchmark-libero--af-unix--policy-openvla-oft
      OVLAB_OFFLINE_MODE: hf-hub-offline,transformers-offline,network-none
      OVLAB_MOUNT_CONTRACT: config-bundle-ro,resolved-checkpoint-ro,rpc-rw
      NVIDIA_VISIBLE_DEVICES: ${OVLAB_GPU_DEVICE:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    volumes:
      - *config-bundle
      - rpc-oft:/run/ovlab
      - type: bind
        source: ${OVLAB_RESOLVED_CHECKPOINT_PATH:?checkpoint resolver did not set a host path}
        target: /checkpoints/resolved/${OVLAB_RESOLVED_CHECKPOINT_ID}
        read_only: true
    healthcheck: *policy-health

  benchmark-oft:
    <<: *policy-security
    profiles: [oft]
    image: ${OVLAB_BENCHMARK_IMAGE:-ovlab-benchmark-libero:local}
    command: [run, "${OVLAB_EXPERIMENT_CONFIG:?configuration bundle resolver did not set an experiment path}", --output-root, /var/lib/ovlab/runs]
    environment:
      OVLAB_DEPLOYMENT_PROFILE: ${OVLAB_DEPLOYMENT_PROFILE:-oft}
      OVLAB_EXECUTION_PROFILE: ${OVLAB_EXECUTION_PROFILE:?configuration bundle resolver did not set an execution profile}
      OVLAB_CONFIG_BUNDLE_SHA256: ${OVLAB_CONFIG_BUNDLE_SHA256:?configuration bundle resolver did not set an identity}
      MUJOCO_GL: egl
      MUJOCO_EGL_DEVICE_ID: ${OVLAB_EGL_DEVICE_ID:-0}
      OVLAB_IMAGE_DIGEST: ${OVLAB_BENCHMARK_IMAGE_DIGEST:-unavailable}
      OVLAB_DEPLOYMENT_MANIFEST_SHA256: ${OVLAB_DEPLOYMENT_MANIFEST_SHA256:-unavailable}
      OVLAB_CONTAINER_RUNTIME_VERSION: ${OVLAB_CONTAINER_RUNTIME_VERSION:-unavailable}
      OVLAB_SERVICE_TOPOLOGY: benchmark-libero--af-unix--policy-openvla-oft
      OVLAB_OFFLINE_MODE: network-none
      OVLAB_MOUNT_CONTRACT: config-bundle-ro,datasets-ro,runs-rw,rpc-rw
      OVLAB_POSTPROCESSING_MODE: external
      OVLAB_RESOLVED_CHECKPOINT_ID: ${OVLAB_RESOLVED_CHECKPOINT_ID}
      OVLAB_RESOLVED_CHECKPOINT_CONTAINER_PATH: /checkpoints/resolved/${OVLAB_RESOLVED_CHECKPOINT_ID}
      OVLAB_CHECKPOINT_ID: ${OVLAB_RESOLVED_CHECKPOINT_ID}
      OVLAB_CHECKPOINT_SOURCE_KIND: ${OVLAB_CHECKPOINT_SOURCE_KIND}
      OVLAB_CHECKPOINT_HOST_PATH: ${OVLAB_RESOLVED_CHECKPOINT_PATH}
      OVLAB_CHECKPOINT_REPOSITORY: ${OVLAB_CHECKPOINT_REPOSITORY}
      OVLAB_CHECKPOINT_REVISION: ${OVLAB_CHECKPOINT_REVISION}
      OVLAB_CHECKPOINT_SHA256: ${OVLAB_CHECKPOINT_SHA256}
      NVIDIA_VISIBLE_DEVICES: ${OVLAB_GPU_DEVICE:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    gpus: all
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    depends_on:
      policy-openvla-oft:
        condition: service_healthy
        restart: false
    volumes:
      - *config-bundle
      - rpc-oft:/run/ovlab
      - type: bind
        source: ${OVLAB_DATASETS_PATH:?dataset resolver did not set a host path}
        target: /datasets
        read_only: true
      - type: bind
        source: ${OVLAB_RUNS_ROOT:-../../../ovlab-data/runs}
        target: /var/lib/ovlab/runs

  reporting:
    <<: *policy-security
    profiles: [reporting]
    image: ${OVLAB_REPORTING_IMAGE:-ovlab-reporting:local}
    command:
      - report
      - publish
      - --run
      - ${OVLAB_REPORT_RUN_ID:-unset}
      - --profile
      - ${OVLAB_REPORT_PROFILE:-libero-task-default}
      - --report-enabled
      - ${OVLAB_REPORT_ENABLED:-true}
    environment:
      OVLAB_MOUNT_CONTRACT: configs-ro,runs-ro,derived-rw,exports-rw
      OVLAB_RUNS_ROOT: /var/lib/ovlab/runs
      OVLAB_DERIVED_ROOT: /var/lib/ovlab/derived
      OVLAB_EXPORTS_ROOT: /var/lib/ovlab/exports
      OVLAB_DERIVED_DISPLAY_ROOT: ${OVLAB_DERIVED_DISPLAY_ROOT:-/var/lib/ovlab/derived}
      OVLAB_EXPORTS_DISPLAY_ROOT: ${OVLAB_EXPORTS_DISPLAY_ROOT:-/var/lib/ovlab/exports}
      OVLAB_IMAGE_DIGEST: ${OVLAB_REPORTING_IMAGE_DIGEST:-unavailable}
      OVLAB_DEPLOYMENT_MANIFEST_SHA256: ${OVLAB_DEPLOYMENT_MANIFEST_SHA256:-unavailable}
      OVLAB_CONTAINER_RUNTIME_VERSION: ${OVLAB_CONTAINER_RUNTIME_VERSION:-unavailable}
      OVLAB_SERVICE_TOPOLOGY: canonical-runs-ro--reporting--derived-and-exports-rw
      OVLAB_OFFLINE_MODE: network-none
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    volumes:
      - type: bind
        source: ${OVLAB_CONFIGS_ROOT:-../../configs}
        target: /opt/ovlab/configs
        read_only: true
      - type: bind
        source: ${OVLAB_RUNS_ROOT:-../../../ovlab-data/runs}
        target: /var/lib/ovlab/runs
        read_only: true
      - type: bind
        source: ${OVLAB_DERIVED_ROOT:-../../../ovlab-data/derived}
        target: /var/lib/ovlab/derived
      - type: bind
        source: ${OVLAB_EXPORTS_ROOT:-../../../ovlab-data/exports}
        target: /var/lib/ovlab/exports

  export:
    <<: *policy-security
    profiles: [export]
    image: ${OVLAB_REPORTING_IMAGE:-ovlab-reporting:local}
    command: [export, generate, --spec, /etc/ovlab/export.yaml]
    environment:
      OVLAB_MOUNT_CONTRACT: configs-ro,runs-ro,exports-rw,export-spec-ro
      OVLAB_RUNS_ROOT: /var/lib/ovlab/runs
      OVLAB_EXPORTS_ROOT: /var/lib/ovlab/exports
      OVLAB_IMAGE_DIGEST: ${OVLAB_REPORTING_IMAGE_DIGEST:-unavailable}
      OVLAB_DEPLOYMENT_MANIFEST_SHA256: ${OVLAB_DEPLOYMENT_MANIFEST_SHA256:-unavailable}
      OVLAB_CONTAINER_RUNTIME_VERSION: ${OVLAB_CONTAINER_RUNTIME_VERSION:-unavailable}
      OVLAB_SERVICE_TOPOLOGY: canonical-runs-ro--reporting-export-rw
      OVLAB_OFFLINE_MODE: network-none
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    volumes:
      - type: bind
        source: ${OVLAB_CONFIGS_ROOT:-../../configs}
        target: /opt/ovlab/configs
        read_only: true
      - type: bind
        source: ${OVLAB_RUNS_ROOT:-../../../ovlab-data/runs}
        target: /var/lib/ovlab/runs
        read_only: true
      - type: bind
        source: ${OVLAB_EXPORTS_ROOT:-../../../ovlab-data/exports}
        target: /var/lib/ovlab/exports
      - type: bind
        source: ${OVLAB_EXPORT_SPEC_PATH:-../../configs/exports/libero-success-comparison.yaml}
        target: /etc/ovlab/export.yaml
        read_only: true

volumes:
  rpc-openvla:
  rpc-oft:
