name: ovlab

x-policy-security: &policy-security
  user: "10001:10001"
  read_only: true
  network_mode: none
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
  restart: "no"

services:
  reporting:
    <<: *policy-security
    profiles: [reporting]
    image: ${OVLAB_REPORTING_IMAGE:-ovlab-reporting:local}
    command:
      - report
      - publish
      - --run
      - ${OVLAB_REPORT_RUN_ID:-unset}
      - --profile
      - ${OVLAB_REPORT_PROFILE:-libero-task-default}
      - --report-enabled
      - ${OVLAB_REPORT_ENABLED:-true}
    environment:
      OVLAB_PROGRESS: ${OVLAB_PROGRESS:-auto}
      OVLAB_ARTIFACT_UMASK: "0007"
      OVLAB_MOUNT_CONTRACT: configs-ro,runs-ro,exports-rw
      OVLAB_RUNS_ROOT: /var/lib/ovlab/runs
      OVLAB_EXPORTS_ROOT: /var/lib/ovlab/exports
      OVLAB_EXPERIMENT_ID: ${OVLAB_EXPERIMENT_ID:-}
      OVLAB_EXPERIMENT_NODE: ${OVLAB_EXPERIMENT_NODE:-}
      OVLAB_DERIVED_DISPLAY_ROOT: ${OVLAB_DERIVED_DISPLAY_ROOT:-/var/lib/ovlab/exports/evaluate/derived}
      OVLAB_EXPORTS_DISPLAY_ROOT: ${OVLAB_EXPORTS_DISPLAY_ROOT:-/var/lib/ovlab/exports}
      OVLAB_IMAGE_DIGEST: ${OVLAB_REPORTING_IMAGE_DIGEST:-unavailable}
      OVLAB_DEPLOYMENT_MANIFEST_SHA256: ${OVLAB_DEPLOYMENT_MANIFEST_SHA256:-unavailable}
      OVLAB_CONTAINER_RUNTIME_VERSION: ${OVLAB_CONTAINER_RUNTIME_VERSION:-unavailable}
      OVLAB_SERVICE_TOPOLOGY: canonical-runs-ro--reporting--unified-exports-rw
      OVLAB_OFFLINE_MODE: network-none
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    volumes:
      - type: bind
        source: ${OVLAB_CONFIGS_ROOT:-../../configs}
        target: /opt/ovlab/configs
        read_only: true
      - type: bind
        source: ${OVLAB_RUNS_ROOT:-../../../ovlab-data/runs}
        target: /var/lib/ovlab/runs
        read_only: true
      - type: bind
        source: ${OVLAB_EXPORTS_ROOT:-../../../ovlab-data/exports}
        target: /var/lib/ovlab/exports

  export:
    <<: *policy-security
    profiles: [export]
    image: ${OVLAB_REPORTING_IMAGE:-ovlab-reporting:local}
    command: [export, generate, --spec, /etc/ovlab/export.yaml]
    environment:
      OVLAB_PROGRESS: ${OVLAB_PROGRESS:-auto}
      OVLAB_ARTIFACT_UMASK: "0007"
      OVLAB_MOUNT_CONTRACT: configs-ro,runs-ro,exports-rw,export-spec-ro
      OVLAB_RUNS_ROOT: /var/lib/ovlab/runs
      OVLAB_EXPORTS_ROOT: /var/lib/ovlab/exports
      OVLAB_EXPERIMENT_ID: ${OVLAB_EXPERIMENT_ID:-}
      OVLAB_EXPERIMENT_NODE: ${OVLAB_EXPERIMENT_NODE:-}
      OVLAB_IMAGE_DIGEST: ${OVLAB_REPORTING_IMAGE_DIGEST:-unavailable}
      OVLAB_DEPLOYMENT_MANIFEST_SHA256: ${OVLAB_DEPLOYMENT_MANIFEST_SHA256:-unavailable}
      OVLAB_CONTAINER_RUNTIME_VERSION: ${OVLAB_CONTAINER_RUNTIME_VERSION:-unavailable}
      OVLAB_SERVICE_TOPOLOGY: canonical-runs-ro--reporting-export-rw
      OVLAB_OFFLINE_MODE: network-none
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    volumes:
      - type: bind
        source: ${OVLAB_CONFIGS_ROOT:-../../configs}
        target: /opt/ovlab/configs
        read_only: true
      - type: bind
        source: ${OVLAB_RUNS_ROOT:-../../../ovlab-data/runs}
        target: /var/lib/ovlab/runs
        read_only: true
      - type: bind
        source: ${OVLAB_EXPORTS_ROOT:-../../../ovlab-data/exports}
        target: /var/lib/ovlab/exports
      - type: bind
        source: ${OVLAB_EXPORT_SPEC_PATH:-../../configs/exports/libero-success-comparison.yaml}
        target: /etc/ovlab/export.yaml
        read_only: true

  dataset-acquire:
    profiles: [dataset-acquire]
    image: ${OVLAB_DATASET_IMAGE:-ovlab-dataset:local}
    command: [dataset, providers]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g,uid=10001,gid=10001,mode=0700
    restart: "no"
    environment:
      OVLAB_PROGRESS: ${OVLAB_PROGRESS:-auto}
      OVLAB_MODEL_DATA_ROOT: /var/lib/ovlab/model-data
      OVLAB_MOUNT_CONTRACT: datasets-rw
      OVLAB_NETWORK_CONTRACT: explicit-acquisition-only
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    volumes:
      - type: bind
        source: ${OVLAB_MODEL_DATA_ROOT:-../../../ovlab-data}/datasets
        target: /var/lib/ovlab/model-data/datasets

  training-openvla:
    <<: *policy-security
    profiles: [training]
    image: ${OVLAB_TRAINING_IMAGE:-ovlab-training-openvla:local}
    entrypoint: [python, -m, ovlab_benchctl.training_worker]
    command: [train, --run-root, /var/lib/ovlab/training-run]
    environment:
      OVLAB_PROGRESS: ${OVLAB_PROGRESS:-auto}
      OVLAB_TRAINING_RUNTIME: isolated-container
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: offline
      OVLAB_TRAINING_BASE_CHECKPOINT: /checkpoints/base
      OVLAB_TRAINING_DATA_ROOT: /datasets/resolved
      OVLAB_TRAINING_DATASET_NAME: ${OVLAB_TRAINING_DATASET_NAME:-unset}
      OVLAB_MOUNT_CONTRACT: prepared-dataset-ro,base-checkpoint-ro,training-run-rw
      OVLAB_NETWORK_CONTRACT: disabled
      NVIDIA_VISIBLE_DEVICES: ${OVLAB_GPU_DEVICE:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    volumes:
      - type: bind
        source: ${OVLAB_TRAINING_BASE_CHECKPOINT_PATH:-/tmp}
        target: /checkpoints/base
        read_only: true
      - type: bind
        source: ${OVLAB_TRAINING_PREPARED_DATASET_PATH:-/tmp}
        target: /datasets/resolved/${OVLAB_TRAINING_DATASET_NAME:-unset}/1.0.0
        read_only: true
      - type: bind
        source: ${OVLAB_TRAINING_RUN_PATH:-/tmp}
        target: /var/lib/ovlab/training-run

  checkpoint-finalizer:
    <<: *policy-security
    profiles: [training-finalize]
    image: ${OVLAB_DATASET_IMAGE:-ovlab-dataset:local}
    entrypoint: [python, -m, ovlab_benchctl.training_worker]
    command:
      - finalize
      - --run-root
      - /var/lib/ovlab/training-run
      - --model-data-root
      - /var/lib/ovlab/model-data
    environment:
      OVLAB_PROGRESS: ${OVLAB_PROGRESS:-auto}
      OVLAB_MOUNT_CONTRACT: training-run-rw,finalized-checkpoints-rw
      OVLAB_NETWORK_CONTRACT: disabled
    group_add:
      - ${OVLAB_HOST_ARTIFACT_GID:-1000}
    volumes:
      - type: bind
        source: ${OVLAB_TRAINING_RUN_PATH:-/tmp}
        target: /var/lib/ovlab/training-run
      - type: bind
        source: ${OVLAB_MODEL_DATA_ROOT:-../../../ovlab-data}/checkpoints
        target: /var/lib/ovlab/model-data/checkpoints
