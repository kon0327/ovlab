[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovlab-example-benchmark"
version = "1.0.0"
description = "Independent CPU benchmark example for the OVLAB public plugin API"
requires-python = ">=3.10"
dependencies = ["ovlab-benchmarks>=0.2.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
example_benchmark = ["task_catalog.json"]
