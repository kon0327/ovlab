# One task, one rollout, two environment steps. Verifies integration, not model quality.
schema_version: "ovlab.experiment/v1"
kind: "workflow"
id: "openvla-eval-smoke"
name: "openvla plugin evaluation and reporting smoke"
execution:
  max_workers: 1
config:
  evaluate:
    profile: "plugin://openvla/evaluate/default.yaml"
    patch:
      experiment:
        id: "openvla-eval-smoke"
        name: "openvla evaluation smoke"
        tags:
          - "openvla"
          - "smoke"
      components:
        benchmark: "plugin://libero/benchmark/default.yaml"
        metrics: "ovlab://metrics/default.yaml"
        protocol: "ovlab://protocols/smoke.yaml"
        artifacts: "ovlab://artifacts/default.yaml"
        policy: "plugin://openvla/policy/lora.yaml"
      reporting:
        enabled: true
        profile: "libero-task-default"
        on_task_finalize: true
        on_run_finalize: true
        failure_policy: "warn"
    component_patches:
      benchmark:
        settings:
          task_indices:
            - 0
          initialization:
            settling_steps: 1
      protocol:
        reproducibility:
          require_checkpoint_identity: true
execute:
  - "evaluate"
