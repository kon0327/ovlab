schema_version: "0.1.0"
kind: experiment

deployment:
  profile: oft
  renderer: egl

reporting:
  enabled: true
  profile: libero-task-default
  on_task_finalize: true
  on_run_finalize: true
  failure_policy: warn

experiment:
  id: libero10-openvla-oft-rpc-smoke
  name: Native OpenVLA-OFT methodological reference on LIBERO-10 through local RPC
  tags: [libero-10, openvla-oft, action-chunk, rpc, smoke, methodological-reference]

components:
  benchmark: benchmarks/libero/libero10-oft-smoke.yaml
  policy: policies/openvla-oft/libero10-native.yaml
  metrics: metrics/action-safe-v1.yaml
  protocol: protocols/libero-oft-smoke-v1.yaml
  action_interface: interfaces/actions/libero-osc-pose-v1.yaml
  artifacts: artifacts/filesystem.yaml

resources:
  registry: resources/registry.yaml
