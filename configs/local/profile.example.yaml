schema_version: "0.1.0"
kind: local_profile
id: example-local-machine

paths:
  checkpoint_root: /absolute/path/to/checkpoints
  dataset_root: /absolute/path/to/datasets
  runs_root: /absolute/path/to/ovlab-data/runs

devices:
  primary_gpu: cuda:0

# Optional machine-local override for the EGL device selected by a portable
# execution profile. It does not select the renderer backend.
execution:
  libero:
    renderer:
      device_id: 0
