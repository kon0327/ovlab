schema_version: "0.1.0"
kind: policy
type: openvla_oft

settings:
  checkpoint_id: openvla-oft-7b-finetuned-libero-10
  processor_id: openvla-oft-7b-finetuned-libero-10
  unnorm_key: libero_10_no_noops

  input:
    cameras:
      primary: camera.primary.rgb
      wrist: camera.wrist.rgb
    proprioception: robot.proprioception

  runtime:
    device_resource: primary_gpu
    dtype: bfloat16
    quantization: none
    attention_implementation: null
    local_files_only: true
    trust_remote_code: true
    deterministic: true
    synchronize_inference: true

  action:
    codec: openvla-to-libero-v1
    interface_ref: interfaces/actions/libero-osc-pose-v1.yaml

  raw_output:
    enabled: false
