[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovlab-runner"
version = "0.2.0"
description = "Synchronous in-process experiment runner for OVLAB"
readme = "README.md"
authors = [{ name = "Jiří Konečný" }]
requires-python = ">=3.10"
dependencies = ["ovlab-core>=0.2.0", "ovlab-benchmarks>=0.2.0", "ovlab-policy-sdk>=0.2.0", "ovlab-metrics>=0.2.0", "numpy>=1.24", "Jinja2>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ovlab_runner = ["report_assets/profiles/*.yaml", "report_assets/templates/**/*.html", "report_assets/static/*.css"]
