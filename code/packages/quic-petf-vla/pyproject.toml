[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quic-petf-vla"
version = "0.1.0"
description = "Portable determinant compound adapters for dense PyTorch models"
authors = [{ name = "Jiří Konečný" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "safetensors>=0.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
