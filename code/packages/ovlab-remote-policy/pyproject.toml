[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovlab-remote-policy"
version = "0.2.0"
description = "Versioned local RPC boundary for OVLAB policy adapters"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "ovlab-core>=0.2.0",
  "ovlab-policy-sdk>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
