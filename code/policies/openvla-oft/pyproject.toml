[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovlab-openvla-oft"
version = "0.2.0"
description = "OpenVLA-OFT methodological reference adapter"
authors = [{ name = "Jiří Konečný" }]
requires-python = ">=3.10"
dependencies = [
  "ovlab-core>=0.2.0",
  "ovlab-policy-sdk>=0.2.0",
  "ovlab-openvla-common>=0.2.0",
  "ovlab-remote-policy>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
