[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovlab-openvla-oft"
version = "0.1.0"
description = "OpenVLA-OFT methodological reference adapter"
requires-python = ">=3.10"
dependencies = [
  "ovlab-core",
  "ovlab-policy-sdk",
  "ovlab-openvla-common",
  "ovlab-remote-policy",
]

[tool.setuptools.packages.find]
where = ["src"]
