# Six evaluation runs: three pretrained model families, each unquantized and
# 4-bit, on the same two tasks. Short episodes exercise reporting, not quality.
schema_version: ovlab.experiment/v1
kind: workflow
id: libero10-reporting-eval-smoke
name: LIBERO-10 model and quantization reporting smoke

execution:
  # One GPU: avoid loading multiple model variants at the same time.
  max_workers: 1

config:
  evaluate:
    profile: libero10-lora-full-three-per-task.yaml
    patch:
      components:
        protocol: protocols/libero-official-episode-v1.yaml
    component_patches:
      benchmark:
        settings:
          task_indices: [0, 1]
      protocol:
        execution:
          # One episode per task, capped for a quick smoke test.
          maximum_episode_steps: 30

children:
  - id: lora
    name: OpenVLA LoRA
    config:
      evaluate:
        patch:
          experiment:
            id: reporting-libero10-lora
            name: Pretrained LoRA on two LIBERO-10 tasks
            tags: [libero-10, lora, reporting-smoke, one-episode-per-task]
    children:
      - id: full
        name: LoRA, unquantized
        execute: [evaluate]
      - id: four-bit
        name: LoRA, 4-bit
        config:
          evaluate:
            patch:
              components:
                policy: plugin://openvla/policies/openvla-lora/merged-libero10-4bit.yaml
        execute: [evaluate]

  - id: oft
    name: OpenVLA OFT
    config:
      evaluate:
        profile: libero10-oft-full-three-per-task.yaml
        patch:
          experiment:
            id: reporting-libero10-oft
            name: Pretrained OFT on two LIBERO-10 tasks
            tags: [libero-10, oft, reporting-smoke, one-episode-per-task]
          components:
            protocol: protocols/libero-oft-episode-v1.yaml
    children:
      - id: full
        name: OFT, unquantized
        execute: [evaluate]
      - id: four-bit
        name: OFT, 4-bit
        config:
          evaluate:
            patch:
              components:
                policy: plugin://openvla/policies/openvla-oft/libero10-native-4bit.yaml
        execute: [evaluate]

  - id: vanilla
    name: OpenVLA Vanilla
    config:
      evaluate:
        patch:
          experiment:
            id: reporting-libero10-vanilla
            name: Vanilla OpenVLA on two LIBERO-10 tasks
            tags: [libero-10, vanilla, reporting-smoke, one-episode-per-task]
          components:
            policy: plugin://openvla/policies/openvla-vanilla/base.yaml
    children:
      - id: full
        name: Vanilla, unquantized
        execute: [evaluate]
      - id: four-bit
        name: Vanilla, 4-bit
        config:
          evaluate:
            patch:
              components:
                policy: plugin://openvla/policies/openvla-vanilla/4bit.yaml
        execute: [evaluate]
