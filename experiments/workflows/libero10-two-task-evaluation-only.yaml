# Evaluation-only counterpart to libero10-two-task-training-smoke.yaml.
# LoRA and OFT use their configured LIBERO-10 reference checkpoints. QuIC uses
# the existing finalized adapter recorded below; update its path and hashes to
# select a different saved checkpoint. All branches run tasks 0 and 1 once,
# for up to 520 steps per episode.
schema_version: ovlab.experiment/v1
kind: workflow
id: libero10-two-task-evaluation-only
name: LIBERO-10 two-task evaluation without training

execution:
  max_workers: 1

children:
  - id: lora
    name: Configured merged-LoRA reference
    config:
      evaluate:
        profile: libero10-lora-full-three-per-task.yaml
        patch:
          experiment:
            id: libero10-lora-reference-two-task
            name: Configured merged-LoRA reference on two LIBERO-10 tasks
            tags: [libero-10, lora, configured-reference, one-episode-per-task]
          components:
            protocol: protocols/libero-official-episode-v1.yaml
        component_patches:
          benchmark:
            settings:
              task_indices: [0, 1]
    children:
      - id: full
        name: Merged-LoRA reference, full precision
        execute: [evaluate]
      - id: eight-bit
        name: Merged-LoRA reference, 8-bit
        config:
          evaluate:
            profile: libero10-lora-8bit-three-per-task.yaml
        execute: [evaluate]
      - id: four-bit
        name: Merged-LoRA reference, 4-bit
        config:
          evaluate:
            profile: libero10-lora-4bit-three-per-task.yaml
        execute: [evaluate]

  - id: quic
    name: Existing trained QuIC checkpoint
    config:
      evaluate:
        profile: libero10-quic-adapter-rpc-smoke.yaml
        patch:
          experiment:
            id: libero10-quic-checkpoint-two-task
            name: Existing trained QuIC checkpoint on two LIBERO-10 tasks
            tags: [libero-10, quic, configured-checkpoint, one-episode-per-task]
          components:
            protocol: protocols/libero-official-episode-v1.yaml
        component_patches:
          benchmark:
            settings:
              task_indices: [0, 1]
          policy:
            settings:
              quic:
                adapter_path: ../ovlab-data/checkpoints/local/checkpoint-17ad34c448be870c3ac375750577507c/weights-or-adapter
                adapter_manifest_sha256: cc4ac78e732ecef47d488cfb52679a84125a6dac754da758eb5290a3cf69edf5
                adapter_tensor_sha256: 6495139e276e3cfd288d6405e591d426db21944c505f7e32701f16550eebbd94
    execute: [evaluate]

  - id: oft
    name: Configured pretrained OFT reference
    config:
      evaluate:
        profile: libero10-oft-full-three-per-task.yaml
        patch:
          experiment:
            id: libero10-oft-reference-two-task
            name: Configured pretrained OFT reference on two LIBERO-10 tasks
            tags: [libero-10, oft, pretrained-reference, one-episode-per-task]
          components:
            protocol: protocols/libero-oft-episode-v1.yaml
        component_patches:
          benchmark:
            settings:
              task_indices: [0, 1]
    children:
      - id: full
        name: OFT reference, full precision
        execute: [evaluate]
      - id: eight-bit
        name: OFT reference, 8-bit
        config:
          evaluate:
            profile: libero10-oft-8bit-three-per-task.yaml
        execute: [evaluate]
      - id: four-bit
        name: OFT reference, 4-bit
        config:
          evaluate:
            profile: libero10-oft-4bit-three-per-task.yaml
        execute: [evaluate]
