# End-to-end plugin smoke: train -> finalized adapter -> evaluation -> reports.
# Uses the plugin's QuIC defaults through the local training-profile wrapper.
# Sized for one 24 GiB GPU; this checks integration, not model quality.
# Run: ovlab run experiments/workflows/libero10-plugin-pipeline-smoke.yaml
# Inspect without executing: ovlab run --plan experiments/workflows/libero10-plugin-pipeline-smoke.yaml
schema_version: ovlab.experiment/v1
kind: workflow
id: libero10-plugin-pipeline-smoke
name: LIBERO-10 plugin training, evaluation and reporting smoke

execution:
  max_workers: 1

config:
  train:
    profile: openvla-libero10-quic-smoke.yaml
    patch:
      id: libero10-plugin-pipeline-smoke-train
      dataset:
        partition:
          groups:
            - LIVING_ROOM_SCENE2_put_both_the_alphabet_soup_and_the_tomato_sauce_in_the_basket
          max_episodes_per_group: 2
          validation_fraction: 0.5
          frame_stride: 8
          max_frames_per_episode: 4
      training:
        max_steps: 3
        per_device_batch_size: 1
        gradient_accumulation_steps: 1
        validation_batches: 1
      resources:
        max_vram_gib: 24
  evaluate:
    # Empty node path refers to this workflow's root training phase.
    # The finalized adapter identity replaces the evaluation profile's placeholder.
    checkpoint_from: ""
    profile: libero10-quic-adapter-rpc-smoke.yaml
    patch:
      experiment:
        id: libero10-plugin-pipeline-smoke-eval
        name: Evaluate the newly trained plugin smoke adapter
        tags: [libero-10, plugins, quic, checkpoint-handoff, reporting, smoke]
      reporting:
        enabled: true
        profile: libero-task-default
        on_task_finalize: true
        on_run_finalize: true
        failure_policy: warn
    component_patches:
      benchmark:
        settings:
          task_indices: [0]
      protocol:
        execution:
          rollouts_per_task: 1
          maximum_episode_steps: 2

execute: [train]
children:
  - id: evaluate-checkpoint
    name: Evaluate finalized adapter and publish reports
    execute: [evaluate]
